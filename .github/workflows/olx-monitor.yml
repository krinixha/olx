name: OLX Monitor + Pages

on:
  workflow_dispatch:   # manual trigger
  schedule:
    - cron: "0 * * * *"   # every hour (adjust as needed)
    
permissions:
  contents: write   # ✅ allow the bot to push commits
  
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run OLX monitor
        run: python olx_monitor.py

      - name: Commit docs/index.html and seen.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html seen.json || true
          git diff --cached --quiet || git commit -m "chore: update OLX monitor site & seen.json [skip ci]"
          git push

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
